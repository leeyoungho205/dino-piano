<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>공룡 피아노</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff;
  font-family:"Jua","NanumSquareRound","Nanum Gothic","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}

/* ---------- 위쪽 메뉴 (선생님용) ---------- */
header{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;padding:.6vh 1vw;background:#fff;border-bottom:.6vh solid #ffd166}
.title{font-weight:900;font-size:24px;font-size:clamp(20px,2.4vw,46px);color:#2f9e44;margin-right:1.5vw;white-space:nowrap}
.grp{display:flex;flex-wrap:wrap;align-items:center;margin:.4vh 1vw .4vh 0;padding:.4vh .5vw;background:#eef3f8;border-radius:999px}
.lab{font-size:14px;font-size:clamp(13px,1.2vw,24px);color:#64748b;margin:0 .6vw;font-weight:700}
button{font:inherit;font-weight:700;font-size:16px;font-size:clamp(15px,1.5vw,30px);border:0;border-radius:999px;
  padding:.9vh 1.3vw;min-height:44px;margin:0 .2vw;background:transparent;color:#334155;cursor:pointer;touch-action:manipulation}
button.on{background:#2f9e44;color:#fff}
button.solo{background:#ff922b;color:#fff;margin:.4vh .4vw}
button.solo:disabled{background:#e2e8f0;color:#94a3b8}
#full{margin-left:auto;background:#4c7dff}

/* ---------- 무대 ---------- */
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:linear-gradient(#bfe8ff 0%,#e6f7ff 30%,#fff6d8 55%)}
.sun{position:absolute;right:5vw;top:3vh;width:11vmin;height:11vmin;border-radius:50%;background:#ffd43b;
  box-shadow:0 0 0 2vmin rgba(255,212,59,.3),0 0 0 4.5vmin rgba(255,212,59,.15)}
.cloud{position:absolute;left:0;width:16vmin;height:5vmin;background:#fff;border-radius:5vmin;opacity:.9;animation:drift 70s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:7vmin;height:7vmin;left:2.5vmin;top:-3.5vmin}
.cloud:after{width:5.5vmin;height:5.5vmin;right:2.5vmin;top:-2.4vmin}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
#hills{position:absolute;left:0;width:100%;top:16%;height:36%}

#hud{position:absolute;left:0;right:0;top:1.4vh;text-align:center;pointer-events:none;z-index:3}
#hint{display:inline-block;max-width:92vw;background:rgba(255,255,255,.88);border-radius:999px;padding:.8vh 2.4vw;
  font-size:18px;font-size:clamp(16px,2.1vw,42px);font-weight:700;color:#334155}
#bar{width:50vw;height:1.8vh;margin:1vh auto 0;background:rgba(255,255,255,.85);border-radius:999px;overflow:hidden;visibility:hidden}
#bar.show{visibility:visible}
#fill{height:100%;width:0;background:#ff922b;border-radius:999px;transition:width .2s}

/* ---------- 건반과 공룡 ---------- */
#board{position:absolute;left:0;right:0;top:13vh;bottom:0;display:flex;padding:0 .6vw;z-index:2}
.col{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;margin:0 .3vw;cursor:pointer}
.dinoWrap{position:relative;flex:0 0 40%;display:flex;align-items:flex-end;justify-content:center}
.dino{display:block;width:calc(var(--s) * 100%);height:calc(var(--s) * 100%);transform-origin:50% 100%;
  animation:idle 2.4s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes idle{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.col.hop .dino{animation:hop .46s ease-out}
@keyframes hop{
  0%{transform:translateY(0) scale(1,1)}
  25%{transform:translateY(-16%) scale(.95,1.07)}
  55%{transform:translateY(0) scale(1.09,.9)}
  78%{transform:translateY(-4%) scale(.99,1.02)}
  100%{transform:translateY(0) scale(1,1)}
}
.mo{display:none}
.col.down .mo,.col.sing .mo{display:inline}
.col.down .mc,.col.sing .mc{display:none}

.key{position:relative;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6vh;
  border-radius:2.4vmin 2.4vmin 0 0;background:var(--c);
  box-shadow:inset 0 -2.6vh 0 rgba(0,0,0,.15),inset 0 .9vh 0 rgba(255,255,255,.35);
  transition:transform .06s,filter .06s}
.key:before{content:"";position:absolute;left:11%;top:5%;width:15%;height:50%;border-radius:999px;background:rgba(255,255,255,.28)}
.name{display:block;width:1.7em;height:1.7em;line-height:1.7em;text-align:center;border-radius:50%;background:#fff;color:var(--d);
  font-weight:900;font-size:5vw;font-size:min(5vw,9vh)}
.hi{color:#fff;font-weight:900;font-size:1.8vw;font-size:min(1.8vw,3.2vh);margin-bottom:.6vh}
.col.down .key{transform:translateY(1.5vh);filter:brightness(1.14)}

.col.next .key{animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{
  from{box-shadow:inset 0 -2.6vh 0 rgba(0,0,0,.15),inset 0 .9vh 0 rgba(255,255,255,.35),0 0 0 .4vmin #fff,0 0 0 0 #ffe066}
  to{box-shadow:inset 0 -2.6vh 0 rgba(0,0,0,.15),inset 0 .9vh 0 rgba(255,255,255,.35),0 0 0 1.2vmin #fff,0 0 5vmin 2.4vmin #ffd43b}
}
.col.next .name{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.2)}}
.col.next:before{content:"\25BC";position:absolute;left:0;right:0;top:-1.5vh;text-align:center;z-index:4;pointer-events:none;
  font-size:6vmin;line-height:1;color:#ff6b00;text-shadow:0 0 .8vmin #fff,0 0 .8vmin #fff,0 0 .8vmin #fff;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(1.6vh)}}

.note{position:absolute;top:18%;z-index:5;pointer-events:none;font-size:7vmin;line-height:1;font-weight:900;color:var(--d);
  text-shadow:0 0 .7vmin #fff,0 0 .7vmin #fff;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-24vh) scale(1.35) rotate(18deg);opacity:0}}

#cheer{position:absolute;left:0;right:0;top:20%;text-align:center;z-index:7;pointer-events:none;
  font-size:11vmin;font-weight:900;color:#ff5a5f;opacity:0;transform:scale(.4);transition:opacity .3s,transform .3s;
  text-shadow:0 0 1.2vmin #fff,0 0 1.2vmin #fff,0 0 1.2vmin #fff,0 .6vmin 0 #ffd43b}
#cheer.show{opacity:1;transform:scale(1)}
.cf{position:absolute;top:-5vh;width:1.7vmin;height:2.8vmin;border-radius:.4vmin;z-index:6;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

/* ---------- 시작 화면 ---------- */
#start{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#bfe8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#start .dino{width:34vmin;height:34vmin;animation:hop 1s ease-out infinite}
#start h1{margin:2vh 0 3vh;font-size:12vmin;color:#2f9e44;text-shadow:0 .6vmin 0 #fff}
#start .go{font-size:5.5vmin;font-weight:900;color:#fff;background:#ff922b;border-radius:999px;padding:2.4vmin 7vmin;animation:pulse .7s ease-in-out infinite alternate}
#start.hide{display:none}
</style>
</head>

  <div class="go">여기를 눌러서 시작!</div>

<script>
(function(){
'use strict';

/* ===== 설정 ===== */
var FREQ=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25]; // 도레미파솔라시도
var NAME={'도':0,'레':1,'미':2,'파':3,'솔':4,'라':5,'시':6,'높':7};   // '높' = 높은 도
var BEAT=430; // 들어 보기 빠르기(1박, 밀리초)
/* 악보: 계이름 뒤 숫자는 박자 길이(없으면 1박) */
var SONGS={
  star:{title:'반짝반짝 작은 별',score:'도 도 솔 솔 라 라 솔2 파 파 미 미 레 레 도2 솔 솔 파 파 미 미 레2 솔 솔 파 파 미 미 레2 도 도 솔 솔 라 라 솔2 파 파 미 미 레 레 도2'},
  butterfly:{title:'나비야',score:'솔 미 미2 파 레 레2 도 레 미 파 솔 솔 솔2 솔 미 미 미 파 레 레2 도 미 솔 솔 미 미 미2 레 레 레 레 레 미 파2 미 미 미 미 미 파 솔2 솔 미 미2 파 레 레2 도 미 솔 솔 도 도 도2'},
  school:{title:'학교 종',score:'솔 솔 라 라 솔 솔 미2 솔 솔 미 미 레4 솔 솔 라 라 솔 솔 미2 솔 미 레 미 도4'},
  plane:{title:'비행기',score:'미1.5 레.5 도 레 미 미 미2 레 레 레2 미 솔 솔2 미1.5 레.5 도 레 미 미 미2 레 레 미 레 도4'}
};
function parse(score){
  var out=[];
  score.split(/\s+/).forEach(function(tok){
    var m=/^(도|레|미|파|솔|라|시|높)([\d.]+)?$/.exec(tok);
    if(m) out.push({n:NAME[m[1]],d:m[2]?parseFloat(m[2]):1});
  });
  return out;
}
Object.keys(SONGS).forEach(function(k){SONGS[k].notes=parse(SONGS[k].score);});

/* ===== 요소 ===== */
function $(id){return document.getElementById(id);}
var board=$('board'),stage=$('stage'),hint=$('hint'),bar=$('bar'),fill=$('fill'),cheer=$('cheer'),
    listenBtn=$('listen'),startEl=$('start');
var cols=Array.prototype.slice.call(document.querySelectorAll('.col'));
var NOTE_CHARS=['\u266A','\u266B','\u2669','\u266C'];

/* ===== 소리 (Web Audio, 외부 파일 없음) ===== */
var ac=null,master=null,sound='piano';
function initAudio(){
  if(!ac){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    ac=new AC();
    master=ac.createGain(); master.gain.value=0.8;
    var comp=ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
  }
  if(ac.state==='suspended'&&ac.resume) ac.resume();
}
function voice(type,f,t,peak,dur,dest){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t+dur+0.05);
  return o;
}
function tone(i){
  if(!ac) return;
  var f=FREQ[i],t=ac.currentTime+0.005;
  if(sound==='piano'){
    voice('triangle',f,t,0.5,1.5,master);
    voice('sine',f*2,t,0.16,1.0,master);
    voice('sine',f*3,t,0.06,0.6,master);
  }else if(sound==='xylo'){
    voice('sine',f*2,t,0.5,0.6,master);
    voice('triangle',f,t,0.2,0.4,master);
    voice('sine',f*8,t,0.12,0.12,master);
  }else{
    var lp=ac.createBiquadFilter();
    lp.type='lowpass'; lp.Q.value=6;
    lp.frequency.setValueAtTime(300,t);
    lp.frequency.exponentialRampToValueAtTime(1800,t+0.15);
    lp.frequency.exponentialRampToValueAtTime(500,t+0.6);
    lp.connect(master);
    var base=f/2;
    var o1=voice('sawtooth',base*0.75,t,0.4,0.65,lp);
    o1.frequency.exponentialRampToValueAtTime(base,t+0.1);
    var o2=voice('square',base*0.375,t,0.18,0.65,lp);
    o2.frequency.exponentialRampToValueAtTime(base/2,t+0.1);
    var l=ac.createOscillator(),lg=ac.createGain();
    l.frequency.value=9; lg.gain.value=base*0.03;
    l.connect(lg); lg.connect(o1.frequency);
    l.start(t); l.stop(t+0.7);
  }
}

/* ===== 건반 동작 ===== */
var holds=[0,0,0,0,0,0,0,0],singT=[],lastTouch=Date.now();
function hopOnly(i){
  var c=cols[i];
  c.classList.remove('hop'); void c.offsetWidth; c.classList.add('hop');
}
function spawnNote(i){
  var s=document.createElement('span');
  s.className='note';
  s.textContent=NOTE_CHARS[Math.floor(Math.random()*NOTE_CHARS.length)];
  s.style.left=(30+Math.random()*40)+'%';
  cols[i].appendChild(s);
  setTimeout(function(){if(s.parentNode) s.parentNode.removeChild(s);},1150);
}
function strike(i){
  initAudio(); tone(i); hopOnly(i); spawnNote(i);
  var c=cols[i];
  c.classList.add('sing');
  clearTimeout(singT[i]);
  singT[i]=setTimeout(function(){c.classList.remove('sing');},380);
}
function down(i,user){
  holds[i]++; cols[i].classList.add('down');
  strike(i);
  if(user){lastTouch=Date.now(); guideCheck(i);}
}
function up(i){
  if(i<0) return;
  holds[i]=Math.max(0,holds[i]-1);
  if(!holds[i]) cols[i].classList.remove('down');
}
function flash(i,ms){
  cols[i].classList.add('down'); strike(i);
  setTimeout(function(){if(!holds[i]) cols[i].classList.remove('down');},ms);
}
board.addEventListener('animationend',function(e){
  if(e.animationName==='hop'){
    var c=e.target.closest?e.target.closest('.col'):null;
    if(c) c.classList.remove('hop');
  }
});

/* ===== 터치 입력 (여러 손가락 동시 + 미끄러지며 치기) ===== */
var active={};
function colAt(x,y){
  var el=document.elementFromPoint(x,y);
  var c=el&&el.closest?el.closest('.col'):null;
  return c?+c.getAttribute('data-i'):-1;
}
function pStart(id,x,y){
  var i=colAt(x,y);
  if(i<0) return;
  if(active[id]!==undefined) up(active[id]);
  active[id]=i; down(i,true);
}
function pMove(id,x,y){
  if(active[id]===undefined) return;
  var prev=active[id],i=colAt(x,y);
  if(i===prev) return;
  up(prev); active[id]=i;
  if(i>=0) down(i,true);
}
function pEnd(id){
  if(active[id]===undefined) return;
  up(active[id]); delete active[id];
}
function clearAll(){
  Object.keys(active).forEach(function(id){up(active[id]);});
  active={};
}
if(window.PointerEvent){
  board.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0) return;
    e.preventDefault();
    try{e.target.releasePointerCapture(e.pointerId);}catch(err){}
    pStart('p'+e.pointerId,e.clientX,e.clientY);
  });
  window.addEventListener('pointermove',function(e){pMove('p'+e.pointerId,e.clientX,e.clientY);});
  window.addEventListener('pointerup',function(e){pEnd('p'+e.pointerId);});
  window.addEventListener('pointercancel',function(e){pEnd('p'+e.pointerId);});
}else{
  var eachTouch=function(e,fn){for(var k=0;k<e.changedTouches.length;k++) fn(e.changedTouches[k]);};
  board.addEventListener('touchstart',function(e){e.preventDefault();eachTouch(e,function(t){pStart('t'+t.identifier,t.clientX,t.clientY);});},{passive:false});
  board.addEventListener('touchmove',function(e){e.preventDefault();eachTouch(e,function(t){pMove('t'+t.identifier,t.clientX,t.clientY);});},{passive:false});
  board.addEventListener('touchend',function(e){e.preventDefault();eachTouch(e,function(t){pEnd('t'+t.identifier);});},{passive:false});
  board.addEventListener('touchcancel',function(e){eachTouch(e,function(t){pEnd('t'+t.identifier);});});
  board.addEventListener('mousedown',function(e){if(e.button===0) pStart('m',e.clientX,e.clientY);});
  window.addEventListener('mousemove',function(e){pMove('m',e.clientX,e.clientY);});
  window.addEventListener('mouseup',function(){pEnd('m');});
}
window.addEventListener('blur',clearAll);
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('dragstart',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* 컴퓨터 자판: 1~8 또는 A S D F G H J K */
var KEYMAP={'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7,a:0,s:1,d:2,f:3,g:4,h:5,j:6,k:7};
var kdown={};
window.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase();
  if(KEYMAP[k]===undefined||kdown[k]||e.repeat) return;
  kdown[k]=true; down(KEYMAP[k],true);
});
window.addEventListener('keyup',function(e){
  var k=(e.key||'').toLowerCase();
  if(!kdown[k]) return;
  delete kdown[k]; up(KEYMAP[k]);
});

/* ===== 노래 따라 치기 ===== */
var song=null,pos=0,done=false,auto=false,autoTimer=null,token=0;
function refresh(){
  cols.forEach(function(c){c.classList.remove('next');});
  if(!song){
    hint.textContent='건반이나 공룡을 손가락으로 톡톡! 눌러 보세요';
    bar.classList.remove('show');
    listenBtn.disabled=true; listenBtn.textContent='들어 보기';
    return;
  }
  bar.classList.add('show');
  listenBtn.disabled=false;
  listenBtn.textContent=auto?'멈추기':'들어 보기';
  fill.style.width=(done?100:(pos/song.notes.length*100))+'%';
  if(auto){
    hint.textContent='\u266A '+song.title+' \u2014 잘 들어 보세요';
  }else{
    hint.textContent='\u266A '+song.title+' \u2014 반짝이는 건반을 눌러 보세요';
    if(!done) cols[song.notes[pos].n].classList.add('next');
  }
}
function guideCheck(i){
  if(!song||auto||done) return;
  if(song.notes[pos].n!==i) return;
  pos++;
  if(pos>=song.notes.length) finish();
  else refresh();
}
function finish(){
  done=true;
  var my=++token;
  refresh(); celebrate();
  setTimeout(function(){
    if(token!==my) return;
    done=false; pos=0; refresh();
  },4200);
}
function celebrate(){
  cheer.classList.add('show');
  setTimeout(function(){cheer.classList.remove('show');},2600);
  [0,2,4,7].forEach(function(n,k){setTimeout(function(){flash(n,200);},400+k*130);});
  setTimeout(function(){for(var i=0;i<8;i++) hopOnly(i);},1050);
  var colors=['#ff5a5f','#ff9a1f','#f7c600','#3fbf5f','#22b8e6','#4c7dff','#9b5de5','#ff5fa2'];
  for(var k=0;k<70;k++){
    (function(){
      var d=document.createElement('div');
      d.className='cf';
      d.style.left=(Math.random()*100)+'%';
      d.style.background=colors[Math.floor(Math.random()*colors.length)];
      var dur=2.2+Math.random()*1.8;
      d.style.animationDuration=dur+'s';
      d.style.animationDelay=(Math.random()*0.8)+'s';
      stage.appendChild(d);
      setTimeout(function(){if(d.parentNode) d.parentNode.removeChild(d);},(dur+1)*1000);
    })();
  }
}
function stopAuto(){
  auto=false; clearTimeout(autoTimer); autoTimer=null;
}
function autoStep(){
  if(!auto||!song) return;
  if(pos>=song.notes.length){
    stopAuto(); pos=0; refresh(); return;
  }
  var nt=song.notes[pos];
  flash(nt.n,Math.min(260,nt.d*BEAT*0.6));
  pos++; refresh();
  autoTimer=setTimeout(autoStep,nt.d*BEAT);
}
function setSong(key){
  stopAuto(); token++; done=false; pos=0;
  song=(key==='free')?null:SONGS[key];
  Array.prototype.forEach.call(document.querySelectorAll('#songGrp button'),function(b){
    b.classList.toggle('on',b.getAttribute('data-song')===key);
  });
  refresh();
}
$('songGrp').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;
  if(!b) return;
  initAudio(); setSong(b.getAttribute('data-song'));
});
$('soundGrp').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;
  if(!b) return;
  sound=b.getAttribute('data-sound');
  Array.prototype.forEach.call(document.querySelectorAll('#soundGrp button'),function(x){
    x.classList.toggle('on',x===b);
  });
  flash(0,200);
});
listenBtn.addEventListener('click',function(){
  if(!song) return;
  initAudio();
  if(auto){stopAuto(); pos=0; refresh();}
  else{token++; done=false; pos=0; auto=true; refresh(); autoTimer=setTimeout(autoStep,300);}
});
$('full').addEventListener('click',function(){
  var d=document,el=d.documentElement;
  var fs=d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(fs){
      var x=d.exitFullscreen||d.webkitExitFullscreen;
      if(x) x.call(d);
    }else{
      var r=el.requestFullscreen||el.webkitRequestFullscreen;
      if(r){var p=r.call(el); if(p&&p.catch) p.catch(function(){});}
    }
  }catch(err){}
});

/* ===== 시작 화면 ===== */
var started=false;
function begin(e){
  if(e) e.preventDefault();
  if(started) return;
  started=true;
  initAudio();
  startEl.classList.add('hide');
  [0,2,4,7].forEach(function(n,k){setTimeout(function(){flash(n,200);},150+k*140);});
  lastTouch=Date.now();
}
startEl.addEventListener('click',begin);
startEl.addEventListener('touchend',begin,{passive:false});

/* 한동안 아무도 안 누르면 공룡이 혼자 폴짝 */
setInterval(function(){
  if(!started||auto) return;
  if(Date.now()-lastTouch>12000) hopOnly(Math.floor(Math.random()*8));
},4000);

refresh();
})();
</script>
</body>
</html>
